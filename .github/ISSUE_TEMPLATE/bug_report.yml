name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.6.1"
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options: [Local GPU, RunPod, fal.ai / Replicate, Not generating (UI, chat, editor)]
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: Settings > Logs > "Make report", then paste the contents (API keys are hidden automatically).
      render: text
